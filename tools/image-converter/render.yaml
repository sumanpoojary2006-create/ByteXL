services:
  - type: web
    name: bytexl-image-converter
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    envVars:
      - key: BYTEXL_UPLOAD_TOKEN
        sync: false
      - key: BYTEXL_UPLOAD_URL
        value: https://app.bytexl.ai/api/upload/s3
      - key: FRONTEND_ORIGINS
        value: https://image-converter-pi-rouge.vercel.app
